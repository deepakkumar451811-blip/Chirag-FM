   <!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chirag FM - AI Video Story Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
        textarea, select, button { width: 100%; margin-top: 10px; padding: 10px; border-radius: 5px; border: none; box-sizing: border-box; }
        textarea { height: 100px; }
        button { background-color: #ff4757; color: white; font-weight: bold; cursor: pointer; }
        .preview-btn { background-color: #2ed573; margin-top: 5px; }
        audio { width: 100%; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>📻 Chirag FM Story Generator</h2>
    
    <form action="/generate" method="POST">
        <label>अपनी कहानी दर्ज करें:</label>
        <textarea name="text" placeholder="यहाँ अपनी कहानी लिखें..." required></textarea>
        
        <label>आवाज़ चुनें (Voice):</label>
        <select name="voice" id="voiceSelect">
            <option value="hi_swara">Hindi Female (Swara - क्लियर आवाज़)</option>
            <option value="hi_madhur">Hindi Male (Madhur - भारी/सिनेमैटिक)</option>
            <option value="en_in_neerja">Indian Storyteller Female (Neerja)</option>
            <option value="en_in_prabhat">Indian Male News Anchor (Prabhat)</option>
        </select>

        <button type="button" class="preview-btn" onclick="playVoicePreview()">🔊 चुने हुए आवाज़ का सैंपल सुनें</button>
        <audio id="audioPlayer" controls></audio>

        <label style="margin-top:15px; display:block;">कैरेक्टर चुनें:</label>
        <select name="character">
            <option value="anime">Anime Style Character</option>
            <option value="human">Human Cinematic Style</option>
        </select>

        <button type="submit">🚀 Video Generate & Download</button>
    </form>
</div>

<script>
function playVoicePreview() {
    var voice = document.getElementById('voiceSelect').value;
    var formData = new FormData();
    formData.append('voice', voice);

    var btn = document.querySelector('.preview-btn');
    btn.innerText = "⏳ आवाज़ लोड हो रही है...";

    fetch('/preview_voice', {
        method: 'POST',
        body: formData
    })
    .then(response => response.blob())
    .then(blob => {
        var audioUrl = URL.createObjectURL(blob);
        var player = document.getElementById('audioPlayer');
        player.src = audioUrl;
        player.style.display = 'block';
        player.play();
        btn.innerText = "🔊 चुने हुए आवाज़ का सैंपल सुनें";
    })
    .catch(err => {
        alert('ऑडियो लोड करने में समस्या आई!');
        btn.innerText = "🔊 चुने हुए आवाज़ का सैंपल सुनें";
    });
}
</script>

</body>
</html>
