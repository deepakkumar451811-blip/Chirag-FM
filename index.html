<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chirag FM - AI Story Studio</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 480px; margin: auto; background: #1e1e1e; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #ff4757; margin-bottom: 20px; }
        label { display: block; text-align: left; margin-top: 12px; font-weight: bold; font-size: 14px; color: #ccc; }
        textarea, select, button { width: 100%; margin-top: 6px; padding: 12px; border-radius: 8px; border: none; box-sizing: border-box; font-size: 15px; }
        textarea { height: 110px; background: #2b2b2b; color: #fff; resize: vertical; }
        select { background: #2b2b2b; color: #fff; }
        .gen-btn { background-color: #ff4757; color: white; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .preview-btn { background-color: #2ed573; color: white; font-weight: bold; cursor: pointer; margin-top: 8px; }
        audio { width: 100%; margin-top: 10px; display: none; }
        
        .loading-box { display: none; margin-top: 20px; padding: 15px; background: #2b2b2b; border-radius: 10px; }
        .spinner { border: 4px solid #333; border-top: 4px solid #ff4757; border-radius: 50%; width: 35px; height: 35px; animation: spin 1s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #statusText { margin-top: 10px; color: #ff4757; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📻 Chirag FM Story Studio</h2>
    
    <form id="storyForm" onsubmit="generateStory(event)">
        <label>अपनी कहानी लिखें:</label>
        <textarea id="storyText" name="text" placeholder="यहाँ अपनी कहानी लिखें..." required></textarea>
        
        <label>आवाज़ चुनें (Voice):</label>
        <select name="voice" id="voiceSelect">
            <option value="hi_swara">Hindi Female (Swara - क्लियर आवाज़)</option>
            <option value="hi_madhur">Hindi Male (Madhur - भारी/सिनेमैटिक)</option>
            <option value="en_in_neerja">Indian Female (Neerja)</option>
            <option value="en_in_prabhat">Indian Male (Prabhat)</option>
        </select>

        <button type="button" class="preview-btn" onclick="playVoicePreview()">🔊 चुने हुए आवाज़ का सैंपल सुनें</button>
        <audio id="audioPlayer" controls></audio>

        <label>आउटपुट फॉरमैट चुनें (Format):</label>
        <select name="format_type" id="formatSelect" onchange="toggleCharacterOption()">
            <option value="video">🎬 MP4 Video Story (कैरेक्टर के साथ)</option>
            <option value="audio">🎵 MP3 Audio Story (केवल आवाज़)</option>
        </select>

        <div id="characterDiv">
            <label>कैरेक्टर स्टाइल:</label>
            <select name="character" id="characterSelect">
                <option value="anime">Anime Style Character</option>
                <option value="human">Human Cinematic Style</option>
            </select>
        </div>

        <button type="submit" id="submitBtn" class="gen-btn">🚀 Generate & Download Story</button>
    </form>

    <div id="loadingBox" class="loading-box">
        <div class="spinner"></div>
        <p id="statusText">आपकी स्टोरी तैयार हो रही है (कृपया 15-30 सेकंड प्रतीक्षा करें)...</p>
    </div>
</div>

<script>
function toggleCharacterOption() {
    var format = document.getElementById('formatSelect').value;
    var charDiv = document.getElementById('characterDiv');
    charDiv.style.display = (format === 'audio') ? 'none' : 'block';
}

function playVoicePreview() {
    var voice = document.getElementById('voiceSelect').value;
    var formData = new FormData();
    formData.append('voice', voice);

    var btn = document.querySelector('.preview-btn');
    btn.innerText = "⏳ आवाज़ लोड हो रही है...";

    fetch('/preview_voice', { method: 'POST', body: formData })
    .then(response => response.blob())
    .then(blob => {
        var audioUrl = URL.createObjectURL(blob);
        var player = document.getElementById('audioPlayer');
        player.src = audioUrl;
        player.style.display = 'block';
        player.play();
        btn.innerText = "🔊 चुने हुए आवाज़ का सैंपल सुनें";
    })
    .catch(err => {
        alert('ऑडियो लोड करने में समस्या आई!');
        btn.innerText = "🔊 चुने हुए आवाज़ का सैंपल सुनें";
    });
}

function generateStory(e) {
    e.preventDefault();
    
    var submitBtn = document.getElementById('submitBtn');
    var loadingBox = document.getElementById('loadingBox');
    var statusText = document.getElementById('statusText');
    var form = document.getElementById('storyForm');

    submitBtn.style.display = 'none';
    loadingBox.style.display = 'block';
    statusText.innerText = "आपकी स्टोरी तैयार हो रही है (कृपया 15-30 सेकंड रुकें)...";

    var formData = new FormData(form);

    fetch('/generate', { method: 'POST', body: formData })
    .then(response => {
        if (!response.ok) throw new Error("Server Error");
        return response.blob();
    })
    .then(blob => {
        statusText.innerText = "✅ डाउनलोड शुरू हो रहा है!";
        var format = document.getElementById('formatSelect').value;
        var filename = (format === 'audio') ? "chirag_story.mp3" : "chirag_story.mp4";
        
        var url = window.URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => {
            submitBtn.style.display = 'block';
            loadingBox.style.display = 'none';
        }, 3000);
    })
    .catch(err => {
        alert("स्टोरी जनरेट करने में कोई समस्या आई। कृपया पुनः प्रयास करें!");
        submitBtn.style.display = 'block';
        loadingBox.style.display = 'none';
    });
}
</script>

</body>
</html>
